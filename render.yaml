services:
  - type: web
    name: ai-interviewer-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      # Set in the Render dashboard (never commit credentials).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx320m
      # Google sign-in (free). Leave unset to hide the button.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: ai-interviewer-ai-service
    runtime: docker
    plan: free
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      # Set in the Render dashboard. Without a key the evaluator falls back to
      # the keyword heuristic, which is not accurate enough to demo.
      - key: LLM_API_KEY
        sync: false
      - key: TTS_PROVIDER
        value: edge
      - key: STT_PROVIDER
        value: mock
      # Only needed when STT_PROVIDER=deepgram. The mock returns a fixed transcript.
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional Upstash Redis REST cache for rubric results and follow-ups.
      # Without these the service falls back to a process-local TTL cache.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
