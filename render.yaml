services:
  - type: web
    name: ai-interviewer-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      # Set in the Render dashboard (never commit credentials).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://ai-interviewer-rho-hazel.vercel.app

  - type: web
    name: ai-interviewer-ai-service
    runtime: docker
    plan: free
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: TTS_PROVIDER
        value: edge
      - key: STT_PROVIDER
        value: deepgram
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ai-interviewer-rho-hazel.vercel.app
