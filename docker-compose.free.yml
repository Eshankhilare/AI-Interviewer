# Free-only deployment — one Oracle Always Free ARM VM.
# Usage:
#   cp deploy/free.env.example .env     # fill the values
#   docker compose -f docker-compose.free.yml up -d --build
#
# Caddy terminates TLS and serves the React app and the API on the same origin,
# so there is no CORS and no separate frontend host. The AI service is private.
name: ai-interviewer-free

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_interviewer
      MYSQL_USER: interviewer
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ai_interviewer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: interviewer
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AI_SERVICE_URL: http://ai:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in .env}
      AI_SERVICE_TIMEOUT_MS: "120000"
      APP_CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      FRONTEND_URL: https://${APP_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://${APP_DOMAIN}/api/auth/google/callback
      UPLOAD_DIR: /app/uploads
      JAVA_TOOL_OPTIONS: -Xmx768m
      PORT: "8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    networks: [internal]

  ai:
    build:
      context: ./ai-service
    restart: unless-stopped
    environment:
      LLM_PROVIDER: gemini
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      TTS_PROVIDER: edge
      STT_PROVIDER: mock
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      ALLOWED_ORIGINS: https://${APP_DOMAIN}
      PORT: "8001"
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://${APP_DOMAIN}
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        VITE_CONTACT_PHONE: ${CONTACT_PHONE:-}
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks: [internal]

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
