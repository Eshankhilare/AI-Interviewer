name: Security Scan

# Advisory dependency report on every PR. These jobs do not gate the merge:
# the known npm advisories are in the Vite/Vitest build tooling, and the backend
# dependency check needs an NVD API key in CI. The output is there to be read;
# `AUDIT.md` tracks the findings and their status.
on:
  pull_request:
    branches: [main]

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - name: npm audit (advisory)
        run: npm audit --audit-level=high || true

  backend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: OWASP dependency check (advisory)
        run: mvn dependency-check:check -q || true

  ai-service-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install safety pip-audit
      - name: pip-audit (advisory)
        run: pip-audit -r requirements.txt || true
