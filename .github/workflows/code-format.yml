name: Code Formatting

on:
  pull_request:
    branches: [main]

jobs:
  frontend-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      # Errors fail the build; warnings are reported but do not block a PR.
      - run: npm run lint

  ai-service-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      # Only real defects (syntax errors, undefined names) block a PR. Style is not gated.
      - run: flake8 . --select=E9,F63,F7,F82 --exclude=.venv,build
