name: Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Railway (backend + AI service)
        run: echo "Railway redeploys both services from GitHub on push to main"

      - name: Cloudflare Pages (frontend)
        run: echo "Cloudflare Pages rebuilds the frontend on push to main"

      # Render + Vercel remain supported alternatives; see DEPLOY.md.
      - name: Render / Vercel (alternative)
        run: echo "Render and Vercel also auto-deploy from GitHub when configured"
