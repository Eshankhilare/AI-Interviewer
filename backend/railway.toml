# Railway service config — Spring Boot backend.
# In Railway: New Project -> Deploy from GitHub -> set Root Directory to
# `backend`, then add the variables from deploy/backend.env.example.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
