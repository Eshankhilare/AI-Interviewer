spring.application.name=ai-interviewer-backend
server.port=${PORT:8080}

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/ai_interviewer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT - JWT_SECRET is required in production; see JwtUtil
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
# Google OAuth (free; enabled only when both values are set)
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8082/api/auth/google/callback}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}
ai.service.token=${AI_SERVICE_TOKEN:}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:30000}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Judge0 Code Execution
judge0.api.url=https://ce.judge0.com
judge0.api.key=${JUDGE0_API_KEY:}

# Deepgram STT
deepgram.api.key=${DEEPGRAM_API_KEY:}

# ElevenLabs TTS
elevenlabs.api.key=${ELEVENLABS_API_KEY:}

# Rate Limiting (requests per minute)
app.rate-limit.enabled=true
app.rate-limit.max-requests-per-minute=60

# Security headers
app.security.headers.strict-transport-security=true
app.security.headers.content-security-policy=default-src 'self'
app.security.headers.x-content-type-options=nosniff
app.security.headers.x-frame-options=DENY

# Logging
logging.level.com.interviewer=WARN
logging.level.org.springframework.security=WARN
